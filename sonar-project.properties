# ============================================================================
# SonarQube Project Configuration - Home Management Platform
# ============================================================================

# Project identity
sonar.projectKey=BBultitude_Home-Management-Platform_30c20fb7-705a-4ea4-93b9-310faa07f09c
sonar.projectName=Home Management Platform
sonar.projectVersion=1.0

# Sources (multi-language — Python + TypeScript)
sonar.sources=.
sonar.python.version=3.12

# Test source directories
sonar.tests=backend/tests

# Exclusions — dependencies, build artifacts, generated files
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/alembic/versions/**,\
  **/venv/**,\
  **/node_modules/**,\
  **/.git/**,\
  **/dist/**,\
  **/build/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/htmlcov/**,\
  **/.pytest_cache/**,\
  **/uploads/**

# Analysis behaviour — do not wait for quality gate (gate has no conditions; waiting causes exit 3)
sonar.qualitygate.wait=false

# Source encoding
sonar.sourceEncoding=UTF-8
