# ============================================
# Production Docker Compose Configuration
# 3-Container Architecture:
# - Frontend (Nginx) - PUBLIC FACING
# - Backend (FastAPI) - INTERNAL ONLY
# - Database (PostgreSQL) - INTERNAL ONLY
# ============================================

services:
  # PostgreSQL Database - INTERNAL ONLY
  database:
    image: postgres:16-alpine
    container_name: homemanager_db_prod
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_DB: homedb
      POSTGRES_USER: homeuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeuser -d homedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NO PORTS EXPOSED - internal network only

  # FastAPI Backend - INTERNAL ONLY
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: homemanager_backend_prod
    restart: unless-stopped
    networks:
      - internal
    environment:
      # Database connection (internal network) - uses service name 'database'
      DATABASE_URL: postgresql+psycopg://homeuser@database:5432/homedb
      DB_PASSWORD_FILE: /run/secrets/db_password

      # Security secrets
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_encryption_key

      # Application settings
      ENVIRONMENT: production
      DEBUG: "false"

      # CORS - only allow frontend container
      ALLOWED_ORIGINS: http://frontend,http://localhost

      # Session settings
      SESSION_EXPIRY_HOURS: 1
      TRUSTED_DEVICE_EXPIRY_DAYS: 30

      # File upload settings
      MAX_FILE_SIZE_MB: 20
      MAX_STORAGE_PER_USER_MB: 200
      UPLOAD_DIR: /app/uploads
    secrets:
      - db_password
      - jwt_secret
      - mfa_encryption_key
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # NO PORTS EXPOSED - internal network only

  # Nginx Frontend - PUBLIC FACING
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homemanager_frontend_prod
    restart: unless-stopped
    networks:
      - internal
    environment:
      # API URL for runtime config injection
      VITE_API_URL: /api
    ports:
      # ONLY frontend is exposed to host/internet
      # Using port 8001 (port 80 was already in use)
      - "8001:8080"
      # For HTTPS (when Cloudflare/Let's Encrypt is configured)
      # - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

# Docker Secrets (mapped from files)
secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  mfa_encryption_key:
    file: ./secrets/mfa_encryption_key.txt

# Named Volumes (Production - separate from dev)
volumes:
  postgres_data:
    name: homemanager_postgres_prod
    driver: local
  uploads_data:
    name: homemanager_uploads_prod
    driver: local

# Internal Network - NO EXTERNAL ACCESS except via frontend
networks:
  internal:
    driver: bridge
    internal: false  # Set to true for complete isolation (no internet access for containers)
